# Separate dashboard service; import this Blueprint file in Render.
services:
  - type: web
    name: yarabot-dashboard
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/yara-projects/yarabot
    branch: main
    dockerfilePath: ./Dockerfile.dashboard
    healthCheckPath: /healthz
    envVars:
      - key: USE_CLOUD_DB
        value: "true"
      - key: DASHBOARD_HOSTED
        value: "true"
      - key: DASHBOARD_ADMIN_USERNAME
        sync: false
      - key: DASHBOARD_ADMIN_PASSWORD_HASH
        sync: false
      - key: DASHBOARD_SESSION_SECRET
        generateValue: true
      - key: CLOUD_DB_HOST
        sync: false
      - key: CLOUD_DB_PORT
        sync: false
      - key: CLOUD_DB_USER
        sync: false
      - key: CLOUD_DB_PASSWORD
        sync: false
      - key: CLOUD_DB_NAME
        sync: false
